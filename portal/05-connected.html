<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Connected · LuMo Wi-Fi</title>
        <link rel="stylesheet" href="styles.css">
    </head>
<body><div class="shell">
<header class="portal-header">
    <a class="brand" href="index.html" aria-label="LuMo Ads home">
        <img class="brand-logo" src="assets/LumoAds Logo.png" alt="LuMo Ads — Making advertising fashionable"></a><div class="network-chip">Connected</div></header>
<main class="main">
    <section class="card" data-connect-panel>
<div class="success-box">
    <div class="success-icon">✓</div>
    <div class="page-kicker" style="color:var(--status-success)">Connected</div>

</div>
<div class="notice"><strong>Session:</strong> Active · <span data-status-note>Enjoy your connection.</span></div>
<div class="actions">
    <button class="btn btn-primary" onclick="window.location.href='https://www.google.com'">Continue to the Internet</button>
</div>
</section></main>
<footer class="footer">Powered by LuMo Ads · Making advertising fashionable</footer>
